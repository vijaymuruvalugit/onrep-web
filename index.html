<!DOCTYPE html>
<html lang="en" data-coreui-theme="light">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="OnRep — practice, progress, performance.">
    <meta name="author" content="OnRep">
    <title>OnRep</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app
    </noscript>
    <div id="root"></div>
    <script>
      // Razorpay payment-return rewriter.
      //
      // Razorpay Payment Links append their result params
      // (razorpay_payment_id, razorpay_payment_link_id, razorpay_signature, ...)
      // to the callback URL using a standard URL parser. Per RFC, query goes
      // BEFORE the fragment, and in practice the hash fragment is frequently
      // dropped on redirect. Because we use HashRouter, that lands the user on
      // `/?razorpay_*=...` with no hash route — the React app then falls
      // through to the catch-all and bounces to /auth/login.
      //
      // This shim runs BEFORE React mounts. If we detect Razorpay return
      // params at the root URL with no hash route already present, we restore
      // the hash route to the subscription payment-processing page (which
      // polls /auth/me and routes to next after activation).
      //
      // Idempotent: only triggers when there's no usable hash route and
      // Razorpay params are present.
      (function restoreRazorpayHash() {
        try {
          var hash = window.location.hash || '';
          // Already on a hash route — nothing to do. Covers the well-behaved
          // case where the hash survived the redirect.
          if (hash && hash.length > 1 && hash.charAt(1) === '/') return;

          var search = window.location.search || '';
          if (!search) return;

          // Razorpay always sends at least these two params on success.
          var isRzpReturn = /[?&]razorpay_payment_(id|link_id)=/.test(search);
          if (!isRzpReturn) return;

          // Build the hash-routed target. We deliberately do NOT carry the
          // razorpay_* params onto the React route — webhooks are the
          // authoritative activation path; the processing page only polls
          // /auth/me. `next` is recovered by the processing page from its
          // own search params (we have no way to recover it here since it
          // got dropped along with the fragment), and falls back to the
          // role-based dashboard.
          var origin = window.location.origin;
          var path = window.location.pathname || '/';
          window.location.replace(origin + path + '#/subscription/payment-processing');
        } catch (e) {
          // Never block app boot — fall through to the normal React route.
        }
      })();

      // Legacy email-link rewriter.
      //
      // Older backend builds emailed verification + reset-password links as
      // `<origin>/verify-email?token=...` and `<origin>/reset-password?token=...`
      // (no hash). With HashRouter that lands the user on `/` with the token
      // stranded in `window.location.search` — the `/` fallback then bounces
      // unauthenticated users to login, and the token is never consumed.
      //
      // The backend now emits the correct `#/auth/verify-email` form, but
      // already-delivered emails are still in inboxes. This shim restores
      // the intended hash route so those links still work.
      (function restoreOwnerAuthHash() {
        try {
          if (window.location.hash && window.location.hash.length > 1) return;
          var pathname = window.location.pathname || '/';
          var search = window.location.search || '';
          var stripped = pathname.replace(/\/$/, '');
          var map = {
            '/verify-email': '/auth/verify-email',
            '/reset-password': '/auth/reset-password',
            '/accept-invite': '/accept-invite',
            '/accept-parent-invite': '/accept-parent-invite',
          };
          var target = map[stripped];
          if (!target) return;
          window.location.replace(window.location.origin + '/#' + target + search);
        } catch (e) {
          /* fall through */
        }
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
